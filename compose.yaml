name: debezium-lab

services:
  mongo:
    image: docker.io/library/mongo:8.0.34
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          let ok = false;
          try { ok = rs.status().myState === 1; }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
          quit(ok ? 0 : 1);
      # mongosh is a ~250 MB Node process; probing often starves the 2 GiB podman VM
      interval: 10s
      timeout: 10s
      retries: 20

  kafka:
    image: docker.io/apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      # A port probe, not kafka-topics.sh, which starts a whole JVM per check
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 20s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    # Load only the MongoDB plugin; the image ships 13 and loading all of them costs memory the 2 GiB VM lacks
    entrypoint:
      - sh
      - -c
      - mkdir -p /tmp/plugins && ln -sfn /kafka/connect/debezium-connector-mongodb /tmp/plugins/ && exec /docker-entrypoint.sh start
    ports:
      - "8083:8083"
    environment:
      CONNECT_PLUGIN_PATH: /tmp/plugins
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Redpanda Console over Kafbat Kafka UI: ~55 MB vs ~300 MB RSS, which matters in a 2 GiB podman VM
  console:
    image: docker.io/redpandadata/console:v3.14.0
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console/config.yaml:/etc/console/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mongo-data:
